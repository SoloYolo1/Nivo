name: Update NAV
on:
  schedule:
    - cron: "*/5 10-19 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_nav.py
      - id: commit
        run: |
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; else git commit -m "NAV update" && git push && echo "changed=true" >> $GITHUB_OUTPUT; fi
  # A push made by this workflow does not start other workflows, so publish the site from here.
  publish:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
