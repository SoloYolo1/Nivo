name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write   # to publish the APK as a GitHub release, which the app's "Update Nivo" reads
env:
  # SHA-256 of android-assets/nivo-debug.keystore. Every APK must be signed with this key, or Android
  # refuses to install it over the previous one ("App not installed"). The build stops if it differs.
  NIVO_CERT_SHA256: a20c41ed1ab62addce5a20a0f22aff5810a6fccbd15bcec4e3970c4f162b734a
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Version
        run: |
          # versionCode must grow with every build or Android will not update the installed app.
          # yyDDDHHMM (UTC) grows over time, is unique per minute and stays far below Android's limit.
          echo "VCODE=$(date -u +%y%j%H%M)" >> $GITHUB_ENV
          echo "VNAME=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Build and test the app
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Web folder (the app is bundled inside the APK, so it opens instantly and works offline)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          rm -rf www && cp -r dist www
          sed -i "s#__PAGE_URL__#https://$OWNER.github.io/${{ github.event.repository.name }}/#" www/runners/background.js
          grep -n "var PAGE" www/runners/background.js
          # what this build is, and where its updates are published (read by Settings › Updates)
          printf '{"versionCode":%s,"versionName":"%s","repo":"%s","built":"%s"}\n' "$VCODE" "$VNAME" "${{ github.repository }}" "$(date -u +%Y-%m-%dT%H:%MZ)" > www/build.json
          cat www/build.json
      - name: Android project
        run: |
          # The plugins MUST be saved to package.json: `cap sync` discovers plugins by reading the
          # dependencies there, so an install with --no-save produced an APK with no plugins at all
          # (no back button handling, no fingerprint, no notifications). package.json is only
          # changed in this CI checkout; the repository itself keeps React as its one dependency.
          PLUGINS="@capacitor/app@7 @capacitor/haptics@7 @capacitor/splash-screen@7 @capacitor/status-bar@7 @capacitor/local-notifications@7 @capacitor/background-runner@latest-7 @aparajita/capacitor-biometric-auth@9"
          npm i --save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 $PLUGINS
          # Write the config ourselves: `cap init` makes capacitor.config.ts (not .json) when TypeScript
          # is installed, and the CLI prefers a .ts config over .json, so remove any stray one first.
          rm -f capacitor.config.ts capacitor.config.js
          node -e "
            const fs=require('fs'),f='capacitor.config.json';
            const c={appId:'com.mywealth.app',appName:'Nivo',webDir:'www'};
            c.server={androidScheme:'https'};
            c.backgroundColor='#141729';
            // Edge to edge is handled by Nivo's own MainActivity: the app draws under transparent system bars
            // (one continuous surface) and gets their exact sizes as CSS variables. Capacitor's margins are off,
            // because they leave separate coloured strips above and below the app.
            c.android={adjustMarginsForEdgeToEdge:'disable'};
            c.plugins={
              BackgroundRunner:{label:'com.mywealth.app.nav',src:'runners/background.js',event:'checkNav',repeat:true,interval:15,autoStart:true},
              LocalNotifications:{smallIcon:'ic_stat_nivo',iconColor:'#8f9cff'},
              // The native splash stays up until the app's own splash has drawn (the app calls hide()),
              // with a 3 s safety limit, so nothing underneath ever flashes on a cold start.
              SplashScreen:{launchShowDuration:3000,launchAutoHide:true,launchFadeOutDuration:220,backgroundColor:'#141729',androidScaleType:'CENTER_CROP',showSpinner:false,splashFullScreen:false,splashImmersive:false}
            };
            fs.writeFileSync(f,JSON.stringify(c,null,2))"
          cat capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Check that every plugin made it into the Android project
        run: |
          S=android/capacitor.settings.gradle
          cat $S
          MISSING=0
          for p in @capacitor/app @capacitor/haptics @capacitor/splash-screen @capacitor/status-bar @capacitor/local-notifications @capacitor/background-runner @aparajita/capacitor-biometric-auth; do
            if grep -q "node_modules/$p/android" $S; then echo "ok      $p"; else echo "MISSING $p"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then echo "::error::A Capacitor plugin is missing from the Android project. The APK would have no phone features."; exit 1; fi
      - name: Nivo's own native code (back button, haptics, system bars, updates, battery)
        run: |
          J=android/app/src/main/java/com/mywealth/app
          mkdir -p $J
          cp android-native/com/mywealth/app/*.java $J/
          ls -la $J
      - name: Plugin wiring and permissions
        run: |
          # background-runner needs its native library folder on the flatDir path
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#dirs '../capacitor-cordova-android-plugins/src/main/libs', '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'#" android/app/build.gradle
          grep -n "background-runner" android/app/build.gradle
          # permissions: notifications (Android 13+), biometrics, vibration (haptics), background work, installing updates
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' $M
          grep -n "uses-permission" $M
          # predictive back (Android 14+): the app gets the gesture's progress so the page can follow it
          sed -i 's#<application#<application android:enableOnBackInvokedCallback="true"#' $M
          grep -q 'enableOnBackInvokedCallback="true"' $M || { echo "::error::Predictive back flag was not added"; exit 1; }
          for p in VIBRATE POST_NOTIFICATIONS USE_BIOMETRIC REQUEST_INSTALL_PACKAGES; do
            grep -q "android.permission.$p" $M || { echo "::error::Permission $p was not added (the INTERNET line changed?)"; exit 1; }
          done
      - name: Signing key and version (so every new APK installs over the old one and keeps your data)
        run: |
          # A second android {} block is merged into the first by Gradle; values set here win.
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  nivo {
                      storeFile file('../../android-assets/nivo-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              defaultConfig {
                  versionCode ${VCODE}
                  versionName "${VNAME}"
              }
              buildTypes {
                  debug { signingConfig signingConfigs.nivo }
              }
          }
          GRADLE
          tail -20 android/app/build.gradle
      - name: App icon
        run: |
          R=android/app/src/main/res
          for p in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d a f <<< "$p"
            cp android-assets/ic_$a.png $R/mipmap-$d/ic_launcher.png
            cp android-assets/ic_$a.png $R/mipmap-$d/ic_launcher_round.png
            cp android-assets/fg_$f.png $R/mipmap-$d/ic_launcher_foreground.png
            mkdir -p $R/drawable-$d && cp android-assets/stat_$(( a / 2 )).png $R/drawable-$d/ic_stat_nivo.png
          done
          mkdir -p $R/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $R/mipmap-anydpi-v26/ic_launcher.xml
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#171a35</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          find $R -name splash.png -exec cp android-assets/splash.png {} \;
      - name: Launch screen (Android 12+ draws its own splash first; make it the Nivo wordmark on navy, then hand over)
        run: |
          R=android/app/src/main/res
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="splash_bg">#141729</color>\n</resources>\n' > $R/values/splash_bg.xml
          sed -i 's#<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">#<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">\n        <item name="windowSplashScreenBackground">@color/splash_bg</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>\n        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>#' $R/values/styles.xml
          grep -q "windowSplashScreenBackground" $R/values/styles.xml || { echo "::error::Launch theme was not updated (styles.xml changed?)"; exit 1; }
      - name: System bar colours (the app repaints them to match its theme once it is running)
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values-night
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="sb_bg">#f3f4fa</color>\n  <color name="sb_nav">#f3f4fa</color>\n  <bool name="sb_light">true</bool>\n</resources>\n' > $R/values/sb.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="sb_bg">#0f111d</color>\n  <color name="sb_nav">#0f111d</color>\n  <bool name="sb_light">false</bool>\n</resources>\n' > $R/values-night/sb.xml
          sed -i 's#</style>#    <item name="android:statusBarColor">@color/sb_bg</item>\n    <item name="android:navigationBarColor">@color/sb_nav</item>\n    <item name="android:windowLightStatusBar">@bool/sb_light</item>\n    <item name="android:windowLightNavigationBar">@bool/sb_light</item>\n    <item name="android:windowBackground">@color/sb_bg</item>\n</style>#' $R/values/styles.xml
          cat $R/values/styles.xml
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Check the APK before publishing it
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          # 1. signed with Nivo's key (otherwise it cannot update the installed app)
          SHA=$($BT/apksigner verify --print-certs $APK | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "certificate SHA-256: $SHA"
          [ "$SHA" = "$NIVO_CERT_SHA256" ] || { echo "::error::The APK is not signed with android-assets/nivo-debug.keystore ($SHA). It would not install over the existing app."; exit 1; }
          # 2. the version this build claims
          $BT/aapt2 dump badging $APK | grep -E "^package:" | tee /tmp/badging
          grep -q "versionCode='$VCODE'" /tmp/badging || { echo "::error::versionCode is not $VCODE"; exit 1; }
          # 3. every phone feature is compiled in
          unzip -p $APK assets/capacitor.plugins.json | tee /tmp/plugins.json
          for c in AppPlugin HapticsPlugin LocalNotificationsPlugin BiometricAuthNative SplashScreenPlugin StatusBarPlugin; do
            grep -q "$c" /tmp/plugins.json || { echo "::error::$c is not in the APK"; exit 1; }
          done
          $BT/aapt2 dump permissions $APK | tee /tmp/perms
          for p in VIBRATE POST_NOTIFICATIONS USE_BIOMETRIC REQUEST_INSTALL_PACKAGES; do
            grep -q "android.permission.$p" /tmp/perms || { echo "::error::$p is missing from the APK"; exit 1; }
          done
          unzip -p $APK assets/capacitor.config.json > /tmp/capcfg.json
          node -e "const c=require('/tmp/capcfg.json'); if(!c.android||c.android.adjustMarginsForEdgeToEdge!=='disable'){console.error('::error::Edge-to-edge setting is wrong');process.exit(1)} console.log('edge to edge: handled by MainActivity')"
          unzip -p $APK assets/public/build.json
          mkdir -p out && cp $APK "out/nivo-$VNAME-$VCODE.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nivo-apk
          path: out/*.apk
      - name: Publish as a release (Settings › Updates in the app installs it from here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-$VCODE" out/*.apk \
            --title "Nivo $VNAME (build $VCODE)" \
            --notes "Nivo $VNAME, build $VCODE. Install from the app (Settings › Updates) or open this file on the phone. Signed with the Nivo key, so it installs over the previous version and keeps your data." \
            --latest
