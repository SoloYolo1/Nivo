name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web folder
        run: |
          mkdir www
          cp index.html data.json manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png www/
      - name: Android project
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/status-bar@6
          npx cap init "Nivo" com.mywealth.app --web-dir www
          PAGE="https://$OWNER.github.io/${{ github.event.repository.name }}/" node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f));c.server={url:process.env.PAGE,androidScheme:'https'};c.backgroundColor='#131318';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          R=android/app/src/main/res
          for p in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d a f <<< "$p"
            cp ic_$a.png $R/mipmap-$d/ic_launcher.png
            cp ic_$a.png $R/mipmap-$d/ic_launcher_round.png
            cp fg_$f.png $R/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $R/mipmap-anydpi-v26/ic_launcher.xml
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#4547dc</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          find $R -name splash.png -exec cp splash.png {} \;
      - name: Status bar color
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values-night
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="sb_bg">#f2f2f7</color>\n  <color name="sb_nav">#f2f2f7</color>\n  <bool name="sb_light">true</bool>\n</resources>\n' > $R/values/sb.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="sb_bg">#131318</color>\n  <color name="sb_nav">#131318</color>\n  <bool name="sb_light">false</bool>\n</resources>\n' > $R/values-night/sb.xml
          sed -i 's#</style>#    <item name="android:statusBarColor">@color/sb_bg</item>\n    <item name="android:navigationBarColor">@color/sb_nav</item>\n    <item name="android:windowLightStatusBar">@bool/sb_light</item>\n    <item name="android:windowLightNavigationBar">@bool/sb_light</item>\n</style>#' $R/values/styles.xml
          head -40 $R/values/styles.xml
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-wealth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
