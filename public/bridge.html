<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nivo · history</title>
<style>
:root{--bg:#0f111d;--cd:#1c2040;--tx:#f2f3fb;--mu:#9299ba;--gold:#e2bd72;--gold2:#f3d99b;--bd:rgba(255,255,255,.08)}
@media (prefers-color-scheme:light){:root{--bg:#f3f4fa;--cd:#fff;--tx:#121428;--mu:#6b7295;--gold:#b98a2e;--gold2:#dcb25c;--bd:rgba(40,50,110,.10)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:500 15px/1.5 Inter,-apple-system,system-ui,Roboto,sans-serif;padding:24px}
.c{max-width:360px;width:100%;text-align:center}
.sp{width:34px;height:34px;margin:0 auto 18px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--gold);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:20px;margin:0 0 6px;letter-spacing:-.3px}p{color:var(--mu);margin:0 0 18px;font-size:14px}
button{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;font-family:inherit;width:100%;color:#171a35;background:linear-gradient(135deg,var(--gold2),var(--gold));cursor:pointer}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px;text-align:left;font-size:14px}
</style>
</head>
<body>
<div class="c" id="c"><div class="sp"></div><h1>Fetching your Nivo 3 history</h1><p>Going straight back to Nivo…</p></div>
<script>
// Hands Nivo 3's saved data (this site's storage on this phone) back to the installed Nivo app.
// It only ever returns to the app itself (localhost); opened in a browser, it offers a backup to copy instead.
(function () {
  var KEYS = ['mw_navs', 'mw_buys', 'mw_del', 'mw_ovr', 'mw_goal', 'plan3', 'mw_name', 'nv_accounts'];
  var data = {}, found = false;
  try { KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) { data[k] = v; found = true; } }); } catch (e) {}
  data.found = found ? '1' : '0';
  var q = new URLSearchParams(location.search), back = q.get('back') || '';
  var ok = /^(https?|capacitor):\/\/localhost(:\d+)?(\/[\w.\-\/]*)?$/.test(back);
  if (ok) {
    var enc = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    location.replace(back + '#nv-import=' + encodeURIComponent(enc));
    return;
  }
  var c = document.getElementById('c');
  function j(k) { try { return JSON.parse(data[k] || 'null'); } catch (e) { return null; } }
  var navs = j('mw_navs') || [], buys = j('mw_buys') || [];
  if (!found || !navs.length) { c.innerHTML = '<h1>No Nivo history here</h1><p>This browser has no Nivo data saved.</p>'; return; }
  var backup = JSON.stringify({ navs: navs, buys: buys, goal: j('mw_goal') || undefined, accounts: j('nv_accounts') || undefined });
  c.innerHTML = '<h1>Your Nivo history in this browser</h1><div class="box">' + navs.length + ' daily prices<br>' + buys.length + ' purchases</div>' +
    '<button id="cp">Copy backup</button><p style="margin-top:12px">Then in the Nivo app: Settings › Nivo 3 history › paste it.</p>';
  document.getElementById('cp').onclick = function () {
    var b = this;
    (navigator.clipboard ? navigator.clipboard.writeText(backup) : Promise.reject()).then(function () { b.textContent = 'Copied'; }, function () { prompt('Copy this backup', backup); });
  };
})();
</script>
</body>
</html>
