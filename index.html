<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Nivo</title>
<meta name="theme-color" content="#141729">
<meta name="description" content="Your Meezan fund, bank accounts, business and other assets in one place.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>try{var t=JSON.parse(localStorage.getItem("mw_theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="%CSS%">
</head>
<body>
<div id="root"></div>
<noscript>Nivo needs JavaScript to run.</noscript>
<script src="%JS%" defer></script>
</body>
</html>
